name: Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          script: |
            # Navigate to the project directory
            cd ~/mira-ai || exit 1
            
            # Pull the latest changes and force alignment with remote
            echo "Syncing with remote..."
            git fetch origin main
            git reset --hard origin/main
            
            # Remove any untracked files to ensure clean state
            git clean -fd
            
            # Rebuild and restart containers
            echo "Rebuilding and restarting containers..."
            docker compose -f compose.yml up -d --build --force-recreate
            
            
            # Run Migrations (fresh start)
            echo "Running database migrations..."
            docker compose -f compose.yml exec -T app alembic upgrade head
            
            # Seed Hackathon Data (Idempotent)
            echo "Seeding hackathon data..."
            docker compose -f compose.yml exec -T app python scripts/seed_hackathon_data.py
            
            # Seed Templates (Idempotent)
            echo "Seeding email templates..."
            docker compose -f compose.yml exec -T app python scripts/seed_templates.py
            
            # --- TEMPORARY: RESET DB & IMPORT NEW SCENARIOS ---
            echo "Generating Fresh Scenarios CSV..."
            docker compose -f compose.yml exec -T app python scripts/generate_patient_csv.py
            
            echo "Running DB Reset & Import..."
            docker compose -f compose.yml exec -T app python scripts/reset_db_and_import_csv.py
            # --------------------------------------------------
            
            echo "Deployment completed successfully!"
