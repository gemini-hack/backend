[project]
name = "mira-ai"
version = "0.1.0"
description = "Mira AI is a healthcare provider assistant, that helps them to manage their patients and appointments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core backend dependencies
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.45",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.21",
    "email-validator>=2.3.0",
    "redis>=7.1.0",
    "jinja2>=3.1.6",
    "aiosmtplib>=5.0.0",
    # Utilities often needed
    "requests>=2.32.5",
    "user-agents>=2.2.0",
    "celery>=5.4.0",
    "google-genai>=1.59.0",
    "boto3>=1.42.26",
    "livekit-agents[google]~=1.3",
    "WebSockets>=13.0",
    "livekit-plugins-silero~=1.3",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "coverage>=7.12.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
]

[tool.setuptools]
packages = ["app"]
